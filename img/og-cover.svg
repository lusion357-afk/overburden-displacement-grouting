<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="智能注浆开采模型">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1418"/>
      <stop offset="1" stop-color="#122b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.16" fill="none" stroke="#14b8a6" stroke-width="2">
    <path d="M0 240h1200M0 330h1200M0 420h1200"/>
    <path d="M0 160c300 90 900 90 1200 0M0 470c300 90 900 90 1200 0"/>
  </g>
  <rect x="80" y="66" width="10" height="26" rx="4" fill="url(#accent)"/>
